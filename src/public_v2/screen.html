    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' && (!source || source === '')) {
            console.warn('Ignored generic CORS Script error.');
            return false;
        }
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
            errBox = document.createElement('div');
            errBox.id = 'debug-error-box';
            errBox.style.position = 'fixed';
            errBox.style.top = '10px';
            errBox.style.left = '10px';
            errBox.style.backgroundColor = 'rgba(255, 0, 0, 0.9)';
            errBox.style.color = 'white';
            errBox.style.padding = '20px';
            errBox.style.zIndex = '999999';
            errBox.style.fontSize = '20px';
            errBox.style.maxWidth = '80%';
            errBox.style.wordWrap = 'break-word';
            const mountTarget = document.body || document.documentElement;
            if (mountTarget) {
                mountTarget.appendChild(errBox);
            }
        }
        errBox.innerHTML += `<b>ERROR:</b> ${message} at ${source}:${lineno}:${colno}<br>`;
    };
    window.addEventListener('unhandledrejection', function(event) {
        window.onerror(event.reason, 'Promise', 0, 0, event.reason);
    });
    </script>

        var authParam = urlParams.get('auth');

            sessionStorage.setItem('adminAuth', authParam);
            window.history.replaceState({}, document.title, window.location.pathname);
        } else if (!sessionStorage.getItem('adminAuth') && urlParams.get('pass') !== 'obs_screen') {
            const l = localStorage.getItem('econova_lang') || 'vi';
            const message = (typeof I18N !== 'undefined' && I18N[l] && I18N[l].con_access_denied) ? I18N[l].con_access_denied : 'Access denied';

    <audio id="snd_hope_star" src="/sounds/hope_star.mp3" preload="auto"></audio>
    <audio id="snd_countdown_10s" src="/sounds/countdown_10s.mp3" preload="auto"></audio>
    <audio id="snd_countdown_15s" src="/sounds/countdown_15s.mp3" preload="auto"></audio>
    <audio id="snd_finish_turn" src="/sounds/finish_turn.mp3" preload="auto"></audio>
    <audio id="snd_on_stage" src="/sounds/on_stage.mp3" preload="auto"></audio>
    <audio id="snd_choose_package" src="/sounds/choose_package.mp3" preload="auto"></audio>

    <script>
        var timerInterval = null;

        var socket;
        try {
            window.socket = window.socket || io();
            socket = window.socket;
            socket.on('connect', () => {
                const roomPin = new URLSearchParams(window.location.search).get('pin') || sessionStorage.getItem('currentRoomPin') || '';
                if (roomPin) socket.emit('joinRoom', roomPin, (res) => { if (res && res.gameState) { if (typeof handleUpdateState === 'function') handleUpdateState(res.gameState); } });
            });
        } catch (e) {
            console.warn('Socket.io unavailable on screen page:', e);
            socket = { on: () => {}, emit: () => {}, off: () => {} };
            window.socket = socket;
        }
        var audioContextUnlocked = true;
        var isEconovaV3 = false; 
        var currentQrIp = "";
        var round1TimerInterval = null;
        var round1TimeSeconds = 0;

        function hideUnlockOverlay() {
            const overlay = document.getElementById('audioUnlockOverlay');
            if (!overlay) return;
            overlay.style.display = 'none';
            overlay.style.visibility = 'hidden';
            overlay.style.opacity = '0';
            overlay.style.pointerEvents = 'none';
            if (overlay.parentNode) {
                overlay.parentNode.removeChild(overlay);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            hideUnlockOverlay();
            setTimeout(hideUnlockOverlay, 100);
        });
        window.addEventListener('load', hideUnlockOverlay);

        function unlockAudio(event) {
            if (event && event.stopPropagation) event.stopPropagation();
            hideUnlockOverlay();
            if (audioContextUnlocked) return;
            audioContextUnlocked = true;
            var testAudio = new Audio(); testAudio.play().catch(e => {});
        }

        document.addEventListener('pointerdown', unlockAudio, { capture: true });
        document.addEventListener('keydown', unlockAudio, { capture: true });

        function playSound(soundId) {
            if (!audioContextUnlocked) return;
            const el = document.getElementById('snd_' + soundId);
            if (el) { el.currentTime = 0; el.play().catch(e => {}); }
        }
        if (socket && typeof socket.on === 'function') {
            socket.on('playSound', (soundId) => { playSound(soundId); });
        }

        const videoOverlay = document.getElementById('videoOverlay');
        const mainVideo = document.getElementById('mainVideo');
        if (socket && typeof socket.on === 'function') {
            socket.on('playVideo', (url) => {
                if (url) {
                    videoOverlay.style.display = 'flex';
                    if (url.includes('\\') || url.startsWith('C:') || url.startsWith('D:')) {
                        mainVideo.src = '/api/video?path=' + encodeURIComponent(url);
                    } else {
                        mainVideo.src = url;
                    }
                    mainVideo.play().catch(() => {});
                }
            });
            socket.on('closeVideo', () => {
                mainVideo.pause();
                mainVideo.src = '';
                videoOverlay.style.display = 'none';
            });
        }

        if (mainVideo) {
            mainVideo.addEventListener('timeupdate', () => {
                if (socket && socket.emit) {
                    socket.emit('videoSync', mainVideo.currentTime);
                }
            });
            mainVideo.addEventListener('play', () => {
                if (socket && socket.emit) {
                    socket.emit('videoPlayState', 'play');
                }
            });
            mainVideo.addEventListener('pause', () => {
                if (socket && socket.emit) {
                    socket.emit('videoPlayState', 'pause');
                }
            });
        }

        function hideAllThemeElements() {
            const v3Wrapper = document.getElementById('v3-wrapper');
            const v3Master = document.getElementById('v3MasterContainer');
            const ascendFrame = document.getElementById('ascendFrame');
            const defScoreboard = document.getElementById('defaultScoreboard');
            const defQArea = document.getElementById('defaultQuestionArea');
            const ascendQArea = document.getElementById('ascendQuestionArea');
            const defQBox = document.getElementById('defaultQBox');
            const ascendQBox = document.getElementById('ascendQBox');
            const qGridNode = document.getElementById('qGrid');

            if (v3Wrapper) v3Wrapper.style.display = 'none';
            if (v3Master) v3Master.style.display = 'none';
            if (ascendFrame) ascendFrame.style.display = 'none';
            if (defScoreboard) defScoreboard.style.display = 'none';
            if (defQArea) defQArea.style.display = 'none';
            if (ascendQArea) ascendQArea.style.display = 'none';
            if (defQBox) defQBox.style.display = 'none';
            if (ascendQBox) ascendQBox.style.display = 'none';
            if (qGridNode) qGridNode.style.display = 'none';
        }

        function setThemeClass(theme) {
            document.body.className = (theme || 'default') + ' main-screen';
        }

        function startThemeTimer(theme, seconds) {
            socket.emit('startCountdown', seconds);
        }

        function stopThemeTimer() {
            stopCountdown();
        }

        function getTimerEls() {
            var v3Container = document.getElementById('v3MasterContainer');
            if (v3Container && v3Container.style.display !== 'none') {
                return { c: document.getElementById('timerContainerV3'), b: document.getElementById('timerBarV3') };
            }
            if (currentTheme === 'ascend_2026') {
                return { c: document.getElementById('timerContainerAscend'), b: document.getElementById('timerBarAscend') };
            } else if (currentTheme === 'v3') {
                return { c: document.getElementById('timerContainerV3'), b: document.getElementById('timerBarV3') };
            } else {
                return { c: document.getElementById('timerContainerDefault'), b: document.getElementById('timerBarDefault') };
            }
        }

        function stopCountdown() {
            clearInterval(timerInterval);
            
            var elsDefault = { c: document.getElementById('timerContainerDefault'), b: document.getElementById('timerBarDefault') };
            var elsAscend = { c: document.getElementById('timerContainerAscend'), b: document.getElementById('timerBarAscend') };
            var elsV3 = { c: document.getElementById('timerContainerV3'), b: document.getElementById('timerBarV3') };
            
            var v3Container = document.getElementById('v3MasterContainer');
            var isV3 = (v3Container && v3Container.style.display !== 'none') || currentTheme === 'v3';

            if (elsDefault.c && currentTheme !== 'default' && !isV3) elsDefault.c.style.display = 'none';
            if (elsDefault.b) elsDefault.b.style.width = '0%';
            var indDef = document.getElementById('timerIndicatorDefault');
            if (indDef) indDef.style.left = '0%';
            
            if (elsAscend.c && currentTheme !== 'ascend_2026') elsAscend.c.style.display = 'none';
            if (elsAscend.b) elsAscend.b.style.width = '0%';
            
            if (elsV3.c && !isV3) elsV3.c.style.display = 'none';
            if (elsV3.b) {
                elsV3.b.style.transition = 'none';
                elsV3.b.style.width = '0%';
                var handle = elsV3.b.querySelector('#timerHandleV3');
                if (handle) handle.style.display = 'none';
            }
            
            // Remove pulsing animation when stopped
            let activeCircle = elsDefault.c ? elsDefault.c.querySelector('.timer-circle') : null;
            if (activeCircle) activeCircle.classList.remove('active-pulse');
            let activeCircleAsc = elsAscend.c ? elsAscend.c.querySelector('.timer-circle') : null;
            if (activeCircleAsc) activeCircleAsc.classList.remove('active-pulse');
        }

        socket.on('startCountdown', (seconds) => {
            var els = getTimerEls();
            if (els.c) els.c.style.display = (els.c.id === 'timerContainerDefault' || els.c.id === 'timerContainerV3') ? 'flex' : 'block';
            if (els.b) {
                els.b.style.transition = 'none';
                els.b.style.width = '0%';
                els.b.offsetHeight; // trigger reflow
                els.b.style.transition = 'width 0.05s linear';
                els.b.classList.remove('warning');
                if (els.b.id !== 'timerBarV3') els.b.style.background = '';
                var handle = els.b.querySelector('#timerHandleV3');
                if (handle) {
                    handle.style.display = 'none';
                    handle.style.animation = 'pulse-timer-v3 0.6s infinite alternate';
                    handle.style.animationPlayState = 'running';
                }
            }
            var ind = els.c ? els.c.querySelector('.timer-circle') : null;
            if (ind) {
                ind.style.transition = 'none';
                ind.style.left = '0%';
                ind.offsetHeight; // trigger reflow
                ind.style.transition = 'left 0.05s linear';
                ind.classList.add('active-pulse');
            }
            
            var startTime = Date.now();
            var duration = seconds * 1000;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                var elapsed = Date.now() - startTime;
                var percent = (elapsed / duration) * 100;
                var remaining = duration - elapsed;
                
                if (els.b) {
                    if (remaining <= duration * 0.3 && remaining > 0) {
                        els.b.classList.add('warning');
                    } else {
                        els.b.classList.remove('warning');
                    }
                }

                if (percent >= 100) {
                    percent = 100;
                    clearInterval(timerInterval);
                    if (els.b) {
                        var handle = els.b.querySelector('#timerHandleV3');
                        if (handle) handle.style.animationPlayState = 'paused';
                    }
                    var indEnd = els.c ? els.c.querySelector('.timer-circle') : null;
                    if (indEnd) indEnd.classList.remove('active-pulse');
                }
                if (els.b) {
                    els.b.style.width = percent + '%';
                    var handle = els.b.querySelector('#timerHandleV3');
                    if (handle) handle.style.display = (percent <= 0) ? 'none' : 'block';
                }
                var ind = els.c.querySelector('.timer-circle');
                if (ind) {
                    ind.style.left = percent + '%';
                }
            }, 50);
        });

        socket.on('toggleQRCode', () => {
            const overlay = document.getElementById('qrCodeOverlay');
            if (overlay.style.display === 'flex') {
                overlay.style.display = 'none';
            } else {
                overlay.style.display = 'flex';
                if (!currentQrIp) {
                    updateQRCode([window.location.hostname]);
                }
            }
        });

        socket.on('serverIPs', (ips) => {
            updateQRCode(ips);
        });

        function triggerV3Anim(typeOrId) {
            var id = typeOrId;
            if (typeOrId === 'box') id = 'qBoxContainer';
            else if (typeOrId === 'grid') id = 'qGridContainer';
            
            const container = document.getElementById(id);
            if (!container) return;
            
            container.classList.remove('run-anim');
            void container.offsetWidth; 
            container.classList.add('run-anim');
            container.style.display = ''; 
        }
        socket.on('runV3Anim', (type) => triggerV3Anim(type));

        function updateQRCode(ips) {
            var isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
            var url = window.location.origin;
            if (isLocal && ips && ips.length > 0) {
                var ip = ips.find(i => i !== '127.0.0.1' && i !== '::1') || ips[0];
                var port = window.location.port || 39281;
                url = `http://${ip}:${port}`;
            }
            if (currentQrIp === url) return; 
            
            currentQrIp = url;
            const textEl = document.getElementById('qrIpText');
            if (textEl) textEl.innerText = url;
            const container = document.getElementById('qrCodeContainer');
            if (!container) return;
            container.innerHTML = ''; 
            try {
                new QRCode(container, {
                    text: url,
                    width: 400,
                    height: 400,
                    colorDark : "#040f21",
                    colorLight : "#ffffff",
                    correctLevel : QRCode.CorrectLevel.H
                });
            } catch(e) {
                console.error("Lỗi tạo QR:", e);
                container.innerHTML = '<div style="color:red; font-size:20px;">Lỗi tạo QR Code. Đảm bảo qrcode.min.js đã được tải.</div>';
            }
        }
        
        var lastQuestionId = null;
        var lastBuzzedTeam = null;
        
        socket.on('updateState', (state) => {
            var qId = (state.currentQuestion && state.currentQuestion.active) ? (state.currentQuestion.id || state.currentQuestion._id || state.currentQuestion.questionId || state.currentQuestion.idx) : null;
            var buzzed = state.buzzedTeam;
            var questionChanged = (qId !== lastQuestionId);
            var buzzerTurnedOff = (lastBuzzedTeam && !buzzed);
            if (questionChanged || buzzerTurnedOff) {
                stopCountdown();
            }
            lastQuestionId = qId;
            lastBuzzedTeam = buzzed;
            if (state.settings) {
                var s = state.settings;
                var globalEnabled = s.globalFontEnabled || false;
                var fGlobal = s.fontGlobal || 'SF Pro Display Bold';
                var fGeneral = s.fontGeneral || 'SF Pro Display Bold';
                var fQuestion = s.fontQuestion || 'SF Pro Display Bold';
                var fTeam = s.fontTeamName || 'SF Pro Display Bold';
                var fScore = s.fontScore || 'Orbitron';
                
                var styleEl = document.getElementById('dynamic-font-styles-global');
                if (!styleEl) {
                    styleEl = document.createElement('style');
                    styleEl.id = 'dynamic-font-styles-global';
                    document.head.appendChild(styleEl);
                }
                
                var rules = '';
                if (globalEnabled) {
                    rules += `@font-face { font-family: 'CustomFontGlobal'; src: url('/font/${encodeURIComponent(fGlobal)}') format('truetype'); }\n`;
                    rules += `:root { 
                        --font-general: 'CustomFontGlobal', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                        --font-team-name: 'CustomFontGlobal', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                        --font-score: 'CustomFontGlobal', 'Orbitron', sans-serif;
                        --font-question: 'CustomFontGlobal', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                    }`;
                } else {
                    rules += `@font-face { font-family: 'CustomFontGeneral'; src: url('/font/${encodeURIComponent(fGeneral)}') format('truetype'); }\n`;
                    rules += `@font-face { font-family: 'CustomFontQuestion'; src: url('/font/${encodeURIComponent(fQuestion)}') format('truetype'); }\n`;
                    rules += `@font-face { font-family: 'CustomFontTeamName'; src: url('/font/${encodeURIComponent(fTeam)}') format('truetype'); }\n`;
                    rules += `@font-face { font-family: 'CustomFontScore'; src: url('/font/${encodeURIComponent(fScore)}') format('truetype'); }\n`;
                    
                    rules += `:root { 
                        --font-general: 'CustomFontGeneral', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                        --font-team-name: 'CustomFontTeamName', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                        --font-score: 'CustomFontScore', 'Orbitron', sans-serif;
                        --font-question: 'CustomFontQuestion', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                    }`;
                }
                
                if (styleEl.innerHTML !== rules) {
                    styleEl.innerHTML = rules;
                }
            }

            if (!state.teams) return;

            const mainContainer = document.getElementById('main-container');
            if (mainContainer) {
                mainContainer.style.transition = 'opacity 0.3s, visibility 0.3s';
                mainContainer.style.visibility = 'visible';
                mainContainer.style.opacity = '1';
            }
            const v3Wrapper = document.getElementById('v3-wrapper');
            if (v3Wrapper) {
                v3Wrapper.style.transition = 'opacity 0.3s, visibility 0.3s';
                v3Wrapper.style.visibility = 'visible';
                v3Wrapper.style.opacity = '1';
            }
            const round1Timer = document.getElementById('round1-timer-container');
            if (round1Timer) {
                round1Timer.style.opacity = state.activeRound === 1 ? '1' : '0';
                round1Timer.style.visibility = state.activeRound === 1 ? 'visible' : 'hidden';
            }

            if (state.activeRound === 1) {
                var bgGrid = document.querySelector('.bg-grid');
                if (bgGrid) bgGrid.style.display = 'none';
            } else {
                document.body.style.background = '';
                document.documentElement.style.background = '';
                var bgGrid2 = document.querySelector('.bg-grid');
                if (bgGrid2) bgGrid2.style.display = '';
            }

            if (state.settings) {
                currentTheme = state.settings.theme || 'default';
                document.body.className = currentTheme + ' main-screen';
                document.body.style.filter = `brightness(${(state.settings.brightness || 100) / 100})`;
                autoScale();
            }

            var html = '';
            state.teams.forEach(team => {
                var isMain = false;
                if (state.currentQuestion && state.currentQuestion.active) {
                    isMain = (state.currentQuestion.mainTeamId === team.id);
                } else {
                    isMain = (state.turnOrder && state.turnOrder.length > 0 && state.turnOrder[0] === team.id);
                }
                
                var isBuzzed = state.buzzedTeam === team.id;
                var classes = 'team-card';
                if (isMain) classes += ' is-main';
                if (isBuzzed) classes += ' buzzed';
                
                var teamNameDisplay = team.name;

                html += `
                    <div class="${classes}" data-team="${team.id}">
                        <div class="team-name" style="display:flex; align-items:center; justify-content:flex-start; overflow:hidden;"><span class="name-inner" style="display:inline-block; transform-origin:left center; white-space:nowrap;">${teamNameDisplay}</span></div>
                        <div class="team-school" style="display:flex; align-items:center; justify-content:center; overflow:hidden;"><span class="school-inner" style="display:inline-block; transform-origin:center center; white-space:nowrap;">${team.school || '&nbsp;'}</span></div>
                        <div class="team-score">${team.score}</div>
                    </div>
                `;
            });
            document.getElementById('defaultScoreboard').innerHTML = html;
            document.getElementById('ascendScoreboard').innerHTML = html;

            const qBoxScoreboard = document.getElementById('qBoxScoreboard');
            if (qBoxScoreboard && state.teams) {
                var qScoreHtml = '';
                state.teams.forEach((team, idx) => {
                    var isMain = false;
                    if (state.currentQuestion && state.currentQuestion.active) {
                        isMain = (state.currentQuestion.mainTeamId === team.id);
                    } else {
                        isMain = (state.turnOrder && state.turnOrder.length > 0 && state.turnOrder[0] === team.id);
                    }
                    
                    if (currentTheme === 'v3') {
                        if (isMain) {
                            qScoreHtml += `<div class="q-score-item q-team-tab active" id="qt-${idx}"><span class="q-score-name q-team-name">${idx + 1}. ${team.name}</span></div>`;
                        } else {
                            qScoreHtml += `<div class="q-score-item q-team-tab" id="qt-${idx}"><span class="q-score-name q-team-name">${idx + 1}. ${team.name} (${team.score})</span></div>`;
                        }
                    } else {
                        qScoreHtml += `<div class="q-score-item q-team-tab ${isMain ? 'active' : ''}" id="qt-${idx}"><span class="q-score-name q-team-name">${idx + 1}. ${team.name}</span><span class="q-score-value q-team-score" id="qs-${idx}">${team.score}</span></div>`;
                    }
                    if (currentTheme === 'v3' && idx < state.teams.length - 1) {
                        qScoreHtml += `<div class="q-separator"></div>`;
                    }
                });
                qBoxScoreboard.innerHTML = qScoreHtml;
            }

            if (state.showOverallScoreboard) {
                document.getElementById('overallScoreboardOverlay').style.display = 'flex';
                if (state.scoreboardBg) {
                    document.getElementById('overallScoreboardOverlay').style.backgroundImage = `url(${state.scoreboardBg})`;
                } else {
                    document.getElementById('overallScoreboardOverlay').style.backgroundImage = `url('/Themes/Background/B1.png')`;
                }

                var fontTeamName = (state.settings && state.settings.fontTeamName) ? state.settings.fontTeamName : "'SF Pro Display Bold', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";
                var fontScore = (state.settings && state.settings.fontScore) ? state.settings.fontScore : "'SF Pro Display Bold', 'SF Pro Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif";

                var title = (state.settings && state.settings.scoreboardTitle) ? state.settings.scoreboardTitle.trim() : '';

                var teamHtml = '';
                state.teams.forEach(team => {
                    var avatarUrl = `/Themes/Avatars/${team.id}.png`;
                    if (state.avatarTimestamps && state.avatarTimestamps[team.id]) {
                        avatarUrl += `?t=${state.avatarTimestamps[team.id]}`;
                    }
                    
                    var tSize = team.avatarSize !== undefined ? team.avatarSize : 100;
                    var tOverlap = team.avatarOverlap !== undefined ? team.avatarOverlap : 10;
                    var tOffsetX = team.avatarOffsetX !== undefined ? team.avatarOffsetX : 0;

                    teamHtml += `
                        <div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; position: relative; min-width: 0;">
                            <img src="${avatarUrl}" style="width: ${tSize}%; height: auto; max-height: 65vh; object-fit: contain; z-index: 1; transform: translateX(${tOffsetX}%);" onerror="this.style.visibility='hidden'">
                            <div style="width: ${Math.min(tSize, 100)}%; margin-top: -${tOverlap}%; z-index: 2; display: flex; flex-direction: column; border: 3px solid rgba(255, 255, 255, 0.9); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); overflow: hidden;">
                                <div class="overall-team-name-container" style="background: linear-gradient(180deg, #d2e4f6, #9bc2ea); padding: 8px 10px; text-align: center; border-bottom: 2px solid rgba(255,255,255,0.5); overflow: hidden; display: flex; justify-content: center;">
                                    <div class="overall-team-name-inner" style="font-family: 'CustomTeamFont', '${fontTeamName}', sans-serif; font-size: 26px; font-weight: normal; color: #012a5e; margin: 0; text-transform: uppercase; white-space: nowrap; transform-origin: center;">${team.name}</div>
                                </div>
                                <div style="background: linear-gradient(180deg, #1059a4, #083466); padding: 12px 10px; text-align: center;">
                                    <div style="font-family: 'CustomScoreFont', '${fontScore}', sans-serif; font-size: 50px; font-weight: normal; color: #ffffff; margin: 0; line-height: 1;">${team.score}</div>
                                </div>
                            </div>
                        </div>
                    `;
                });

                var yOffset = (state.settings && state.settings.scoreboardY !== undefined) ? state.settings.scoreboardY : 50;

                var titleHtml = title 
                    ? `<div style="position:absolute; top: 10%; width: 100%; text-align: center; z-index: 10;"><span style="font-family:'CustomTeamFont', '${fontTeamName}',sans-serif;font-size:75px;font-weight:normal;color:#fff;text-shadow:0 4px 15px rgba(0,0,0,0.8),0 2px 5px rgba(0,0,0,0.5);letter-spacing:4px;text-transform:uppercase;">${title}</span></div>`
                    : '';

                var overallHtml = `
                    ${titleHtml}
                    <div style="position:absolute;width:100%;top:${yOffset}%;transform:translateY(-${yOffset}%);display:flex;justify-content:center;z-index:5;">
                        <div id="overallScoreboardGrid" style="display:flex;gap:40px;width:90%;max-width:1600px;justify-content:space-around;align-items:flex-end;">
                            ${teamHtml}
                        </div>
                    </div>
                `;

                var styleEl2 = document.getElementById('dynamic-font-styles');
                if (!styleEl2) {
                    styleEl2 = document.createElement('style');
                    styleEl2.id = 'dynamic-font-styles';
                    document.head.appendChild(styleEl2);
                }
                var newStyles = `
                    @font-face { font-family: 'CustomTeamFont'; src: url('/font/${encodeURIComponent(fontTeamName)}') format('truetype'); }
                    @font-face { font-family: 'CustomScoreFont'; src: url('/font/${encodeURIComponent(fontScore)}') format('truetype'); }
                `;
                if (styleEl2.innerHTML !== newStyles) {
                    styleEl2.innerHTML = newStyles;
                }

                document.getElementById('overallScoreboardOverlay').innerHTML = overallHtml;
                
                requestAnimationFrame(() => {
                    document.querySelectorAll('#overallScoreboardGrid .overall-team-name-container').forEach(container => {
                        var inner = container.querySelector('.overall-team-name-inner');
                        if (inner) {
                            inner.style.transform = 'scaleX(1)';
                            var avail = container.clientWidth - 20; 
                            if (inner.scrollWidth > avail && avail > 0) {
                                inner.style.transform = `scaleX(${avail / inner.scrollWidth})`;
                            }
                        }
                    });
                });
            } else {
                document.getElementById('overallScoreboardOverlay').style.display = 'none';
            }

            if (currentTheme === 'ascend_2026') {
                requestAnimationFrame(() => {
                    document.querySelectorAll('#ascendScoreboard .team-card').forEach(card => {
                        var nameContainer = card.querySelector('.team-name');
                        var inner = card.querySelector('.name-inner');
                        if (nameContainer && inner) {
                            inner.style.transform = 'scaleX(1)';

            if (state.currentQuestion && state.currentQuestion.active) {
                var textHtml = state.currentQuestion.isHidden ? '' : (state.currentQuestion.text || state.currentQuestion.content || state.currentQuestion.question || '').toString().replace(/\n/g, '<br>');
                
                if (qTextV3.getAttribute('data-raw') !== textHtml) {
                    qTextV3.innerHTML = textHtml;
                    qTextV3.setAttribute('data-raw', textHtml);
                }
                
                var wrapper = qTextV3.parentElement;
                if (wrapper) {
                    var textLeft = pad + (actual_S / 2) + 20;
                    var textWidth = (gW - scoreW) - textLeft - 10;
                    wrapper.style.left = textLeft + 'px';
                    wrapper.style.width = textWidth + 'px';
                    var doResize = () => {
                        window.doResizeV3 = doResize;
                        var fs = 48;
                        qTextV3.style.setProperty('font-size', fs + 'px', 'important');
                        qTextV3.style.lineHeight = '1.2';
                        qTextV3.style.width = '100%';
                        
                        var maxH = 300; // Hardcode to 300px to avoid browser measurement quirks during transition
                        
                        void qTextV3.offsetHeight; // Force reflow
                        
                        while (qTextV3.scrollHeight > maxH && fs > 18) {
                            fs -= 1;
                            qTextV3.style.setProperty('font-size', fs + 'px', 'important');
                            void qTextV3.offsetHeight; // Force reflow
                        }
                        
                        qTextV3.style.setProperty('font-size', fs + 'px', 'important');
                        qTextV3.style.lineHeight = '1.2';
                        qTextV3.style.width = '100%';
                        
                        if (qTextV3.scrollHeight < maxH - 20) {
                            wrapper.style.alignItems = 'center';
                            wrapper.style.paddingTop = '0px';
                        } else {
                            wrapper.style.alignItems = 'flex-start';
                            wrapper.style.paddingTop = '10px';
                        }
                    };
                    
                    doResize();
                    requestAnimationFrame(doResize);
                    setTimeout(doResize, 150);
                    setTimeout(doResize, 600);
                    setTimeout(doResize, 1300);
                    setTimeout(doResize, 2000);
                    if (document.fonts && document.fonts.ready) {
                        document.fonts.ready.then(doResize);
                    }
                }
            } else {
                qTextV3.innerHTML = '';
                qTextV3.removeAttribute('data-raw');
            }
        }

        var scoreMain = document.getElementById('v3ActiveScore');
        if (scoreMain) {
            var mainTeamId = null;
            if (state.currentQuestion && state.currentQuestion.active) {
                mainTeamId = state.currentQuestion.mainTeamId;
            } else if (state.turnOrder && state.turnOrder.length > 0) {
                mainTeamId = state.turnOrder[0];
            }
            var mainTeam = (mainTeamId && state.teams) ? state.teams.find(t => t.id === mainTeamId) : null;
            scoreMain.textContent = mainTeam ? mainTeam.score : '';
            scoreMain.style.boxSizing = 'border-box';
            scoreMain.style.paddingLeft = (actual_S / 2) + 'px';
            scoreMain.style.paddingRight = pad + 'px';
        }
        var scorePts = [ [actual_S, 0], [scoreW - pad - actual_S/2, 0], [scoreW - pad, gH/2], [scoreW - pad - actual_S/2, gH], [0, gH] ];

        var oBg = tv.querySelector('.o-bg');
        if (oBg) {
            var newBgClip = `polygon(${toPoly(qShapesCfg.bgPts)})`;
            if (oBg.style.clipPath !== newBgClip) oBg.style.clipPath = newBgClip;
            var newBgStyle = `linear-gradient(135deg, ${colorL}, #000)`;
            if (oBg.style.background !== newBgStyle) oBg.style.background = newBgStyle;
        }

        var soBg = tv.querySelector('.s-o-bg');
        if (soBg) {
            var newSoBgD = toSvgPath(qShapesCfg.bgPts);
            if (soBg.getAttribute('d') !== newSoBgD) soBg.setAttribute('d', newSoBgD);
        }

        var scoreEl = tv.querySelector('.o-score');
        if (scoreEl) {
            scoreEl.style.right = 'auto'; 
            scoreEl.style.left = qShapesCfg.separator.left + 'px'; 

            var newScoreClip = `polygon(${toPoly(scorePts)})`;
            if (scoreEl.style.clipPath !== newScoreClip) scoreEl.style.clipPath = newScoreClip;
            var newScoreW = scoreW + 'px';
            if (scoreEl.style.width !== newScoreW) scoreEl.style.width = newScoreW;
            var newScoreBg = `linear-gradient(135deg, ${colorR}, #050a14)`;
            if (scoreEl.style.background !== newScoreBg) scoreEl.style.background = newScoreBg;
        }

        var soScore = tv.querySelector('.s-o-score');
        if (soScore) {
            var newSoScoreD = toSvgPath(scorePts);
            if (soScore.getAttribute('d') !== newSoScoreD) soScore.setAttribute('d', newSoScoreD);
            var newSoScoreTransform = `translate(${qShapesCfg.separator.left}, 0)`;
            if (soScore.getAttribute('transform') !== newSoScoreTransform) soScore.setAttribute('transform', newSoScoreTransform);
        }

        var sep = tv.querySelector('.o-separator');
        if (sep) {
            var newSepH = qShapesCfg.separator.height + 'px';
            if (sep.style.height !== newSepH) sep.style.height = newSepH;
            var newSepLeft = qShapesCfg.separator.left + 'px';
            if (sep.style.left !== newSepLeft) sep.style.left = newSepLeft;
            var newSepTransform = `skewX(-${qShapesCfg.separator.angle}deg)`;
            if (sep.style.transform !== newSepTransform) sep.style.transform = newSepTransform;
        }

        tv.querySelectorAll('.s-o-svg, .s-o-svg-arrows, .s-g-svg, .s-g-svg-arrows').forEach(svg => {
            var newVB = `0 0 ${gW} ${gH}`;
            if (svg.getAttribute('viewBox') !== newVB) svg.setAttribute('viewBox', newVB);
        });

        // FIX TIMER POSITION AND WIDTH - place at vertical center of background panel
        var timerV3 = document.getElementById('timerContainerV3');
        if (timerV3) {
            var timerHeight = 26;
            // Left edge: inner-right of left navy arrow at mid-height = alnPts[2][0], extrapolate to timer's y
            var alnPts = qShapes.alnPts;
            var xLeft_top = alnPts[1][0]; // alnPts top-right corner (at y=0)
            var xLeft_mid = alnPts[2][0]; // alnPts mid point (at y=midY)
            var xLeft_bot = alnPts[3][0]; // alnPts bottom-right corner (at y=gH)
            var sepLeft = qShapesCfg.separator.left;
            var timerTopY = gH - timerHeight;
            var timerBotY = gH;
            // Interpolate left edge X at timerTopY and timerBotY
            var xLeftAtTop = (timerTopY <= midY)
                ? xLeft_top + (xLeft_mid - xLeft_top) * (timerTopY / midY)
                : xLeft_mid + (xLeft_bot - xLeft_mid) * ((timerTopY - midY) / midY);
            var xLeftAtBot = (timerBotY <= midY)
                ? xLeft_top + (xLeft_mid - xLeft_top) * (timerBotY / midY)
                : xLeft_mid + (xLeft_bot - xLeft_mid) * ((timerBotY - midY) / midY);
            // Separator right edge — vertical (no tilt for separator line itself)
            var xRight_top = sepLeft + actual_S;
            var xRight_bot = sepLeft;
            var xRightAtTop = sepLeft + actual_S - slope * timerTopY;
            var xRightAtBot = sepLeft + actual_S - slope * timerBotY;
            // Width at mid: use mid values
            var xL = xLeft_mid;
            var xR = sepLeft + pS;
            var wFull = xR - xL;
            var deltaX = timerHeight * slope;

            // Move timerV3 to leftContent to guarantee it is drawn underneath the text wrapper
            var leftContent = tv.querySelector('.ov-left-content');
            if (leftContent && timerV3.parentNode !== leftContent) {
                leftContent.insertBefore(timerV3, leftContent.firstChild);
            }
            
            timerV3.style.position = 'absolute';
            timerV3.style.bottom = 'auto';
            timerV3.style.top = timerTopY + 'px';
            timerV3.style.left = (xLeftAtTop - 2) + 'px';
            timerV3.style.width = (xRightAtTop - xLeftAtTop + 4) + 'px';
            timerV3.style.height = timerHeight + 'px';
            timerV3.style.minHeight = timerHeight + 'px';
            timerV3.style.margin = '0';
            timerV3.style.padding = '0';
            timerV3.style.transform = 'none';
            timerV3.style.clipPath = `polygon(0 0, 100% 0, calc(100% - ${deltaX + 2}px) 100%, ${deltaX + 2}px 100%)`;
            timerV3.style.display = 'flex';
            timerV3.style.zIndex = '5';
            
            var blackBar = timerV3.querySelector('div');
            if (blackBar) {
                blackBar.style.position = 'absolute';
                blackBar.style.top = '50%';
                blackBar.style.transform = 'translateY(-50%)';
                blackBar.style.left = (12 + deltaX) + 'px';
                blackBar.style.right = (12 + deltaX) + 'px';
                blackBar.style.width = 'auto';
                blackBar.style.height = '8px';
            }
        }

        // Toggle V3 Hope Star GIF based on state
        var hopeStar = document.getElementById('v3HopeStar');
        if (hopeStar) {
            var isHopeActive = false;
            if (state.currentQuestion && state.currentQuestion.isHopeStar && currentV3State === 2 && !v3Transitioning) {
                isHopeActive = true;
            }
            var hopeStarLeft = qShapesCfg.separator.left + (scoreW / 2);
            hopeStar.style.left = hopeStarLeft + 'px';
            
            if (isHopeActive) {
                hopeStar.style.transform = 'translateX(-50%) scale(1)';
                hopeStar.style.opacity = '1';
                if (!window.lastV3HopeStarActive) {
                    playSound('hope_star');
                }
            } else {
                hopeStar.style.transform = 'translateX(-50%) scale(0)';
                hopeStar.style.opacity = '0';
            }
            window.lastV3HopeStarActive = isHopeActive;
        }

        if (typeof window.autoScaleTeamNames === 'function') {
            window.autoScaleTeamNames();
        }
    }

    if (window.currentState && window.currentState.settings && window.currentState.settings.theme === 'v3') {
        isEconovaV3 = true;
        v3Wrapper.style.display = 'block';
        var qArea = document.querySelector('.question-area'); if (qArea) { qArea.style.opacity = '0'; qArea.style.visibility = 'hidden'; }
        var timerDefault = document.getElementById('timerContainerDefault'); if (timerDefault) { timerDefault.style.opacity = '0'; timerDefault.style.visibility = 'hidden'; }
        var bgGrid = document.querySelector('.bg-grid'); if (bgGrid) bgGrid.style.display = 'none';
        renderV3(window.currentState);
    }
});
</script>
</body>
</html>
