    <script>
    window.onerror = function(message, source, lineno, colno, error) {
        if (message === 'Script error.' && (!source || source === '')) {
            console.warn('Ignored generic CORS Script error.');
            return false;
        }
        var errBox = document.getElementById('debug-error-box');
        if (!errBox) {
            errBox = document.createElement('div');
            errBox.id = 'debug-error-box';
            errBox.style.position = 'fixed';
            errBox.style.top = '10px';
            errBox.style.left = '10px';
            errBox.style.backgroundColor = 'rgba(255, 0, 0, 0.9)';
            errBox.style.color = 'white';
            errBox.style.padding = '20px';
            errBox.style.zIndex = '999999';
            errBox.style.fontSize = '20px';
            errBox.style.maxWidth = '80%';
            errBox.style.wordWrap = 'break-word';
            const mountTarget = document.body || document.documentElement;
            if (mountTarget) {
                mountTarget.appendChild(errBox);
            }
        }
        errBox.innerHTML += `<b>ERROR:</b> ${message} at ${source}:${lineno}:${colno}<br>`;
    };
    window.addEventListener('unhandledrejection', function(event) {
        window.onerror(event.reason, 'Promise', 0, 0, event.reason);
    });
    </script>
