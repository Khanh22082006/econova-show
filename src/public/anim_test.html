<script id="v3-script">
document.addEventListener('DOMContentLoaded', () => {
    let currentV3State = null;
    let mainContainer = document.getElementById('main-container') || document.body.firstElementChild; 
    let v3Wrapper = document.getElementById('v3-wrapper');
    let isEconovaV3 = false;

    // Listen to all relevant socket events to mirror the state into V3 independently
    if (typeof socket !== 'undefined') {
        socket.on('updateState', (state) => {
            currentV3State = state;
            if (state && state.settings && state.settings.theme === 'v3') {
                isEconovaV3 = true;
                v3Wrapper.style.display = 'block';
                // Find .question-area inside main-container and hide it
                const qArea = document.querySelector('.question-area');
                if (qArea) {
                    qArea.style.opacity = '0';
                    qArea.style.visibility = 'hidden';
                }
                
                // Hide timer Container Default
                const timerDefault = document.getElementById('timerContainerDefault');
                if (timerDefault) {
                    timerDefault.style.opacity = '0';
                    timerDefault.style.visibility = 'hidden';
                }
                
                renderV3(state);
            } else {
                isEconovaV3 = false;
                v3Wrapper.style.display = 'none';
                const qArea = document.querySelector('.question-area');
                if (qArea) {
                    qArea.style.opacity = '1';
                    qArea.style.visibility = 'visible';
                }
                
                const timerDefault = document.getElementById('timerContainerDefault');
                if (timerDefault) {
                    timerDefault.style.opacity = '1';
                    timerDefault.style.visibility = 'visible';
                }
            }
        });

        // Mirror question text
        socket.on('sendQuestion', (q) => {
            if (isEconovaV3 && q) {
                document.getElementById('qTextV3').innerHTML = q.content || q;
                // update score panel if needed
                if (q.points) document.getElementById('v3EconovaScoreV3').innerText = q.points;
            }
        });

        // Mirror timer
        socket.on('timer-action', (action) => {
            if (!isEconovaV3) return;
            const bar = document.getElementById('timerBarV3');
            if (action.type === 'start') {
                bar.style.transition = 'none';
                bar.style.width = '100%';
                setTimeout(() => {
                    bar.style.transition = 'width ' + action.duration + 's linear';
                    bar.style.width = '0%';
                }, 50);
            } else if (action.type === 'stop' || action.type === 'reset') {
                bar.style.transition = 'none';
                bar.style.width = (action.type === 'reset') ? '100%' : bar.style.width;
            }
        });
    }

    function renderV3(state) {
        window.lastV3State = state;
        
        let isMode1 = state.settings ? state.settings.questionSelectionMode === 1 : true;
        if (state.lockedPackage) isMode1 = (state.lockedPackage.mode === 1);
        
        let computedMachineState = 0;
        
        if (isMode1) {
            if (state.currentQuestion && state.currentQuestion.active) {
                computedMachineState = 2;
            } else if (state.lockedPackage || state.pendingPackage) {
                // Screen Mode 1: khi kết thúc 1 câu mà gói chưa hết → hiện lưới lại tự động
                computedMachineState = 1;
            }
        } else {
            // Mode 2 or 3
            if (state.lockedPackage) {
                if (!window.v3LockedPackageTime) window.v3LockedPackageTime = Date.now();
                if (Date.now() - window.v3LockedPackageTime >= 1000) {
                    computedMachineState = 2;
                } else {
                    computedMachineState = 1;
                    if (!window.v3TransitionTimeout) {
                        window.v3TransitionTimeout = setTimeout(() => {
                            window.v3TransitionTimeout = null;
                            if (window.lastV3State) renderV3(window.lastV3State);
                        }, 1000 - (Date.now() - window.v3LockedPackageTime));
                    }
                }
            } else if (state.pendingPackage) {
                computedMachineState = 1;
                window.v3LockedPackageTime = null;
            } else {
                window.v3LockedPackageTime = null;
            }
        }
        
        state.machineState = computedMachineState;

        const v3Master = document.getElementById('v3MasterContainer');
        const qBoxV3 = document.getElementById('qBoxV3');
        const qGridV3 = document.getElementById('qGridV3');
        
        if (!window.v3Transitioning) window.v3Transitioning = false;
        if (!window.currentV3State) window.currentV3State = 0;
        
        if (state.machineState === window.currentV3State || window.v3Transitioning) {
            if (state.machineState === 1) renderV3Grid(state);
            else if (state.machineState === 2) renderV3QBox(state);
            
            if (state.currentQuestion) {
                let qTextV3 = document.getElementById('qTextV3');
                if (qTextV3) qTextV3.innerHTML = state.currentQuestion.content || 'Đang chờ câu hỏi...';
                let v3Score = document.getElementById('v3EconovaScoreV3');
                if (v3Score) v3Score.innerText = state.currentQuestion.points || '0';
            }
            return;
        }

        if (state.machineState === 0) {
            if (window.currentV3State !== 0) {
                // Exit animation
                window.v3Transitioning = true;
                v3Master.classList.remove('v3-shutter-open', 'run-anim');
                void v3Master.offsetWidth;
                v3Master.classList.add('v3-shutter-close');
                
                setTimeout(() => {
                    v3Master.style.display = 'none';
                    qBoxV3.style.display = 'none';
                    qGridV3.style.display = 'none';
                    window.v3Transitioning = false;
                    window.currentV3State = 0;
                }, 500);
            } else {
                v3Master.style.display = 'none';
                qBoxV3.style.display = 'none';
                qGridV3.style.display = 'none';
            }
            window.currentV3State = 0;
        } else if (state.machineState === 1) {
            renderV3Grid(state);
            if (window.currentV3State === 2) {
                // 2 -> 1: Close shutter over Question, show Grid, Open shutter
                window.v3Transitioning = true;
                v3Master.classList.remove('v3-shutter-open', 'v3-shutter-close', 'run-anim');
                void v3Master.offsetWidth;
                v3Master.classList.add('v3-shutter-close');
                
                setTimeout(() => {
                    qBoxV3.style.display = 'none';
                    qGridV3.style.display = 'flex';
                    
                    v3Master.classList.remove('v3-shutter-open', 'v3-shutter-close', 'run-anim');
                    void v3Master.offsetWidth;
                    v3Master.classList.add('v3-shutter-open', 'run-anim'); 
                    setTimeout(() => { window.v3Transitioning = false; }, 600);
                }, 500);
            } else {
                // 0 -> 1: Expand with Grid
                v3Master.style.display = 'flex';
                qBoxV3.style.display = 'none';
                qGridV3.style.display = 'flex';
                v3Master.classList.remove('v3-shutter-open', 'v3-shutter-close', 'run-anim');
                void v3Master.offsetWidth;
                v3Master.classList.add('v3-shutter-open', 'run-anim');
            }
            window.currentV3State = 1;
        } else if (state.machineState === 2) {
            renderV3QBox(state);
            if (window.currentV3State === 1) {
                // 1 -> 2: Close shutter over Grid, show Question, Open shutter
                window.v3Transitioning = true;
                v3Master.classList.remove('v3-shutter-open', 'v3-shutter-close', 'run-anim');
                void v3Master.offsetWidth;
                v3Master.classList.add('v3-shutter-close');
                
                setTimeout(() => {
                    qGridV3.style.display = 'none';
                    qBoxV3.style.display = 'flex';
                    
                    v3Master.classList.remove('v3-shutter-open', 'v3-shutter-close', 'run-anim');
                    void v3Master.offsetWidth;
                    v3Master.classList.add('v3-shutter-open', 'run-anim');
                    setTimeout(() => { window.v3Transitioning = false; }, 600);
                }, 500);
            } else {
                // 0 -> 2: Expand with Question
                v3Master.style.display = 'flex';
                qGridV3.style.display = 'none';
                qBoxV3.style.display = 'flex';
                v3Master.classList.remove('v3-shutter-open', 'v3-shutter-close', 'run-anim');
                void v3Master.offsetWidth;
                v3Master.classList.add('v3-shutter-open', 'run-anim');
            }
            window.currentV3State = 2;
        }

        // Current question content
        if (state.currentQuestion) {
            document.getElementById('qTextV3').innerHTML = state.currentQuestion.content || 'Đang chờ câu hỏi...';
            document.getElementById('v3EconovaScoreV3').innerText = state.currentQuestion.points || '0';
        }
    }

    function renderV3Grid(state) {
        // Render trực tiếp vào grid10-v3 (bỏ qua grid20, grid40 vì gộp chung vào 1 khối container)
        const gridContainer = document.getElementById('grid10-v3');
        if (!gridContainer) return;
        
        let mode = state.settings ? state.settings.questionSelectionMode : 1;
        if (state.lockedPackage) mode = state.lockedPackage.mode;
        
        if (mode === 1) {
            let html = '<div class="v3-grid-col-row" style="display:flex;flex-direction:row;width:100%;height:100%;justify-content:center;">';
            const colClasses = ['m1-col-left', 'm1-col-center', 'm1-col-right'];
            [10, 20, 40].forEach((pts, colIdx) => {
                let colClass = colClasses[colIdx];
                html += `<div class="v3-col-wrapper ${colClass}" style="width:280px;height:240px;background:linear-gradient(180deg, #004466, #001122);display:flex;flex-direction:column;">`;
                html += `<div class="v3-grid-label" style="height:60px;display:flex;justify-content:center;align-items:center;background:linear-gradient(90deg,#00cfff,#0088cc);font-size:24px;font-weight:bold;color:white;flex-shrink:0;">${pts} ĐIỂM</div>`;
                html += `<div class="v3-grid-cells-area mode1-grid" style="flex:1;display:flex;flex-direction:column;justify-content:space-evenly;align-items:center;padding:10px 0;">`;
                
                let count = (state.questionCount && state.questionCount[pts] !== undefined) ? state.questionCount[pts] : 12;
                // Mỗi cột chứa 4 câu: Col 0 -> 1,4,7,10. Col 1 -> 2,5,8,11. Col 2 -> 3,6,9,12
                for (let rowIdx = 0; rowIdx < 4; rowIdx++) {
                    let qNum = rowIdx * 3 + colIdx; // 0-indexed question number
                    if (qNum >= count) break;
                    let isPlayed = state.playedQuestions && state.playedQuestions[pts] && state.playedQuestions[pts].includes(qNum);
                    
                    if (isPlayed) {
                        html += `<div class="q-cell" style="width:80%;height:35px;display:flex;align-items:center;justify-content:center;background:rgba(0,207,255,0.2);border:1px solid #00cfff;color:#fff;font-weight:bold;border-radius:4px;font-size:20px;">${qNum + 1}</div>`;
                    } else {
                        // Check if active (Mode 1 usually handles active selection differently, often pendingQuestion)
                        let isActive = false;
                        if (state.currentQuestion && state.currentQuestion.active && state.currentQuestion.points == pts && state.currentQuestion.idx === qNum) isActive = true;
                        
                        let cellBg = isActive ? 'linear-gradient(90deg, #e74c3c, #c0392b)' : 'rgba(0,207,255,0.2)';
                        let cellBorder = isActive ? 'none' : '1px solid #00cfff';
                        
                        html += `<div class="q-cell" style="width:80%;height:35px;display:flex;align-items:center;justify-content:center;background:${cellBg};border:${cellBorder};color:#fff;font-weight:bold;border-radius:4px;font-size:20px;">${qNum + 1}</div>`;
                    }
                }
                html += `</div></div>`;
            });
            html += '</div>';
            gridContainer.innerHTML = html;
            document.getElementById('grid20-v3').innerHTML = '';
            document.getElementById('grid40-v3').innerHTML = '';
        } else {
            // Mode 2/3: 3x3 Grid
            let pkg = state.lockedPackage || state.pendingPackage;
            let rawQuestions = pkg ? (pkg.questions || pkg.package || []) : [];
            let qPerTeam = (state.settings && state.settings.questionsPerTeam) || 3;
            
            const rows = [10, 20, 40];
            const rowClasses = {
                10: ['r1-left', 'r1-center', 'r1-right'],
                20: ['r2-left', 'r2-center', 'r2-right'],
                40: ['r3-left', 'r3-center', 'r3-right']
            };
            
            let html = '<div style="display:flex;flex-direction:column;align-items:center;height:100%;justify-content:space-evenly;padding: 10px 0;">';
            rows.forEach((pts, rowIndex) => {
                html += '<div class="v3-grid-row">';
                for (let col = 0; col < qPerTeam; col++) {
                    let qData = rawQuestions[col];
                    let isChosen = (qData && parseInt(qData.points) === pts);
                    
                    let cellClass = rowClasses[pts][col];
                    let isPlayed = false;
                    let isCurrent = false;
                    let qNumberHtml = '';
                    
                    if (isChosen) {
                        if (state.lockedPackage) {
                            if (pkg.currentIndex > col) isPlayed = true;
                            else if (pkg.currentIndex === col) {
                                if (state.currentQuestion && state.currentQuestion.resolved) isPlayed = true;
                                else if (state.currentQuestion && state.currentQuestion.active) isCurrent = true;
                            }
                        }
                        if (mode === 2 && qData.idx !== undefined && qData.idx !== -1) {
                            qNumberHtml = `<div class="q-order-badge">${qData.idx + 1}</div>`;
                        }
                    }
                    
                    let cellStateClass = '';
                    if (isChosen) {
                        cellStateClass = isPlayed ? 'played' : (isCurrent ? 'active-tab' : 'inactive-tab');
                    } else {
                        cellStateClass = 'inactive-tab';
                    }
                    
                    let opacity = '1';
                    let filter = 'none';
                    if (!state.lockedPackage && qData && qData.idx === undefined) { opacity = '0.6'; filter = 'grayscale(1)'; }
                    
                    let margin = col > 0 ? 'margin-left: calc(-1 * var(--v3-skew) + 5px);' : '';
                    html += `<div class="v3-cell-wrapper" style="position:relative; ${margin}">`;
                    html += `<div class="v3-shape-cell ${cellClass} ${cellStateClass}" style="opacity:${opacity}; filter:${filter}; margin-left: 0;">${pts} ĐIỂM</div>`;
                    html += qNumberHtml;
                    html += `</div>`;
                }
                html += '</div>';
            });
            html += '</div>';
            gridContainer.innerHTML = html;
            document.getElementById('grid20-v3').innerHTML = '';
            document.getElementById('grid40-v3').innerHTML = '';
        }
    }


    function renderV3QBox(state) {
        // Render Scoreboard in topbar
        const qBoxScoreboard = document.getElementById('qBoxScoreboardV3');
        if (qBoxScoreboard && state.teams) {
            let qScoreHtml = '<div style="display:flex; flex-direction:row; justify-content:center; align-items:center; width:100%; height:100%; gap:10px;">';
            state.teams.forEach((team, idx) => {
                let isMain = false;
                if (state.currentQuestion && state.currentQuestion.active) {
                    isMain = (state.currentQuestion.mainTeamId === team.id);
                } else if (state.turnOrder && state.turnOrder.length > 0) {
                    isMain = (state.turnOrder[0] === team.id);
                }
                
                let bgColor = isMain ? 'linear-gradient(90deg, #e74c3c, #c0392b)' : 'linear-gradient(90deg, #05164d, #030e33)';
                let border = isMain ? '2px solid #fff' : '2px solid #00cfff';
                let textColor = isMain ? '#fff' : '#00cfff';
                let scoreColor = isMain ? '#ffff00' : '#fff';
                
                qScoreHtml += `<div style="display:flex; align-items:center; justify-content:center; background:${bgColor}; border:${border}; border-radius:4px; padding:4px 15px; font-size:20px; font-weight:bold; transform:skewX(-10deg); box-shadow:0 0 10px rgba(0,0,0,0.5);">
                    <div style="transform:skewX(10deg); display:flex; gap:10px;">
                        <span style="color:${textColor};">${team.name}</span>
                        <span style="color:${scoreColor};">${team.score}</span>
                    </div>
                </div>`;
            });
            qScoreHtml += '</div>';
            qBoxScoreboard.innerHTML = qScoreHtml;
        }

        // Right side package points (e.g. 20 / 20 / 20)
        if (state.packages) {
            let activeTeamId = null;
            if (state.turnOrder && state.turnOrder.length > 0) activeTeamId = state.turnOrder[0];
            if (state.currentQuestion && state.currentQuestion.active) activeTeamId = state.currentQuestion.mainTeamId;
            let p = null;
            if (activeTeamId) p = state.packages.find(pkg => pkg.teamId === activeTeamId);
            
            let ptsHtml = '';
            if (p && p.questions) {
                p.questions.forEach((q, idx) => {
                    let color = '#ffffff'; // unplayed
                    if (q.active) color = '#e74c3c'; // active (red)
                    else if (q.played) color = '#aaaaaa'; // played (gray)
                    
                    ptsHtml += `<span style="color:${color};">${q.points}</span>`;
                    if (idx < p.questions.length - 1) ptsHtml += ` <span style="color:#00cfff;">/</span> `;
                });
            }
            document.getElementById('v3EconovaPointsWrapperV3').innerHTML = ptsHtml;
        }
    }
});
</script>

<div style="position:fixed; bottom:20px; right:20px; z-index:99999; background:rgba(0,0,0,0.8); padding:15px; border-radius:10px; border:1px solid #fff;">
    <h3 style="color:#fff; margin-top:0;">Test Panel</h3>
    <button onclick="document.body.className='ascend_2026'; isEconovaV3=false; applyVisibility();">Theme: Ascend</button>
    <button onclick="document.body.className='v3'; currentTheme='v3'; isEconovaV3=true; applyVisibility();">Theme: V3</button>
    <br><br>
    <button onclick="testGrid()">Show Grid (Mode 2/3)</button>
    <button onclick="testQuestion()">Show Question (Mode 2/3)</button>
    <button onclick="testClose()">Idle/Wait</button>
    <script>
        function testGrid() {
            state.pendingPackage = true;
            state.lockedPackage = false;
            let mainNode = document.querySelector(".v3-new-root");
            if(mainNode) {
                mainNode.classList.remove("run-anim", "v3-shutter-open", "v3-shutter-close");
            }
            applyVisibility();
            if(isEconovaV3) renderV3Grid(state);
        }
        function testQuestion() {
            state.pendingPackage = false;
            state.lockedPackage = true;
            q.active = true;
            let mainNode = document.querySelector(".v3-new-root");
            if(mainNode) {
                mainNode.classList.remove("run-anim", "v3-shutter-open", "v3-shutter-close");
            }
            applyVisibility();
            if(isEconovaV3) {
                renderV3QBox(state);
                setTimeout(() => {
                    let mainNode2 = document.querySelector(".v3-new-root");
                    mainNode2.classList.add("run-anim", "v3-shutter-close");
                    setTimeout(() => {
                        mainNode2.classList.remove("v3-shutter-close");
                        mainNode2.classList.add("v3-shutter-open");
                    }, 600);
                }, 100);
            }
        }
        function testClose() {
            state.pendingPackage = false; state.lockedPackage = false; q.active = false;
            let mainNode = document.querySelector(".v3-new-root");
            if(mainNode) {
                mainNode.classList.remove("run-anim", "v3-shutter-open", "v3-shutter-close");
            }
            applyVisibility();
        }
    </script>
