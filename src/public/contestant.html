<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title data-i18n="con_title">Econova Show - Thí Sinh</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=Orbitron:wght@400;700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/lang.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        let pinParam = urlParams.get('pin');
        if (pinParam) {
            sessionStorage.setItem('currentRoomPin', pinParam);
        }
    </script>
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --bg-primary: #030a1c;
            --team1: #10ac84; --team2: #f39c12; --team3: #6c5ce7; --team4: #e17055;
            --buzz-active: #ff4757; --buzz-inactive: #3a3a50;
        }

        html, body {
            width: 100%; height: 100%; overflow: hidden;
            font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif); background: var(--bg-primary); color: #fff;
            touch-action: none; user-select: none; -webkit-user-select: none;
        }

        body { display: flex; flex-direction: column; }

        /* ===== SCREEN 1: CHỌN ĐỘI ===== */
        #selectScreen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; padding: 20px; z-index: 20; position: relative;
        }
        #selectScreen h1 {
            font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 35px;
            text-transform: uppercase; letter-spacing: 2px; text-align: center;
        }
        #teamBtns { display: grid; grid-template-columns: 1fr; gap: 18px; width: 100%; max-width: 450px; }
        
        /* Skeleton Loading Animation */
        .skeleton-card {
            width: 100%; min-height: 88px; border-radius: 16px;
            background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.12) 50%, rgba(255,255,255,0.04) 75%);
            background-size: 200% 100%;
            animation: skeleton-shimmer 1.5s infinite linear;
            border: 1px solid rgba(255,255,255,0.08);
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
            padding: 15px; box-sizing: border-box;
        }
        @keyframes skeleton-shimmer {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
        .skeleton-bar-title {
            width: 140px; height: 22px; border-radius: 6px;
            background: rgba(255,255,255,0.15);
        }
        .skeleton-bar-sub {
            width: 90px; height: 14px; border-radius: 4px;
            background: rgba(255,255,255,0.08);
        }
        
        .team-btn {
            width: 100%; min-height: 88px; border: none; border-radius: 16px;
            font-size: 24px; font-weight: 700; color: #fff; cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif);
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12), rgba(255, 255, 255, 0.05));
            border: 2px solid rgba(255, 255, 255, 0.18);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
        }
        .team-btn:active:not(:disabled) { transform: scale(0.97); }
        .team-btn:disabled {
            background: rgba(40, 40, 60, 0.4) !important;
            border-color: rgba(255, 255, 255, 0.05) !important;
            box-shadow: none !important;
            color: #718093 !important;
            cursor: not-allowed;
        }
        .team-btn span.school { font-size: 14px; color: rgba(255,255,255,0.65); font-weight: 400; margin-top: 4px; }


        /* ===== SCREEN 2: NÚT CHUÔNG ===== */
        #buzzScreen {
            display: none; flex-direction: column; height: 100vh; position: relative; z-index: 10;
        }
        
        .top-bar {
            padding: 15px 20px; display: flex; justify-content: space-between; align-items: center;
            background: rgba(255,255,255,0.05); border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .team-info { display: flex; flex-direction: column; }
        .team-name { font-size: 24px; font-weight: 700; text-transform: uppercase; }
        .team-school { font-size: 14px; color: rgba(255,255,255,0.6); }
        .score-display { font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif); font-size: 32px; font-weight: 700; color: #fff; }

        .timer-container {
            width: 100%; height: 10px; background: rgba(255,255,255,0.1); position: absolute; top: 0; left: 0; z-index: 1000;
        }
        .timer-bar {
            height: 100%; width: 0%; background: #00d2d3; transition: width 0.1s linear;
        }

        .main-area { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; width: 100%; padding: 10px; box-sizing: border-box; }
        
        .status-text {
            position: relative; margin-bottom: 20px; text-align: center;
            font-size: 18px; font-weight: 700; color: rgba(255,255,255,0.9); text-transform: uppercase; letter-spacing: 1px;
            background: rgba(0, 0, 0, 0.45); padding: 8px 24px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.18);
            max-width: 90%; transition: all 0.2s ease;
        }

        /* Lưới 36 câu (Thu nhỏ cho Mobile) */
        .grid-container {
            width: 100%; max-width: 580px; margin: auto;
            display: flex; gap: 12px; justify-content: center;
        }
        .grid-col {
            flex: 1; background: rgba(10, 25, 54, 0.8);
            border: 1px solid rgba(0, 210, 211, 0.3); border-radius: 12px;
            padding: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: flex; flex-direction: column;
        }
        .grid-header {
            font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif); font-size: 20px; font-weight: 700;
            text-align: center; margin-bottom: 12px; text-transform: uppercase;
        }
        .grid-cells {
            display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
        }
        .q-cell {
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2);
            border-radius: 6px; padding: 10px 0; text-align: center;
            font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif); font-size: 16px; font-weight: 700;
            color: #fff; transition: all 0.3s;
        }
        .q-cell.played {
            background: rgba(0,0,0,0.5); color: rgba(255,255,255,0.2);
            border-color: rgba(255,255,255,0.05); text-decoration: line-through;
        }
        
        .q-cell.selected-anim {
            animation: cell-blink 0.3s infinite alternate !important;
            background: #fff !important; color: #000 !important; transform: scale(1.1) !important;
            border-color: #00d2d3 !important; box-shadow: 0 0 20px #00d2d3 !important;
            text-decoration: none !important; z-index: 100; position: relative;
        }
        @keyframes cell-blink {
            0% { transform: scale(1); filter: brightness(1); }
            100% { transform: scale(1.15); filter: brightness(1.3); }
        }
        
        #buzzerContainer {
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center;
        }

        .buzzer-wrapper {
            position: relative; width: 320px; height: 320px;
            display: flex; align-items: center; justify-content: center;
        }

        /* Vòng nhấp nháy khi chuông mở */
        .ring {
            position: absolute; inset: 0; border-radius: 50%;
            border: 5px solid var(--buzz-active); opacity: 0;
            transform: scale(1); pointer-events: none;
        }
        .ring.animating { animation: ripple 1.5s infinite ease-out; }
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.4); opacity: 0; }
        }

        .buzz-btn {
            width: clamp(200px, 26vw, 260px); height: clamp(200px, 26vw, 260px); border-radius: 50%; border: none;
            background: #3a3a50; color: #fff; font-size: 28px; font-weight: 700;
            text-transform: uppercase; font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif);
            box-shadow: 0 12px 0 #1a1a2e, inset 0 6px 18px rgba(255,255,255,0.1);
            transition: all 0.15s ease; display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 2; position: relative;
        }
        
        .buzz-btn:active:not(.locked) { transform: translateY(8px); box-shadow: 0 4px 0 #1a1a2e, inset 0 5px 15px rgba(0,0,0,0.3); }
        .buzz-btn.unlocked {
            background: radial-gradient(circle at 30% 30%, #ff6b81, #ee5253) !important;
            box-shadow: 0 12px 0 #c0392b, 0 0 50px rgba(238,82,83,0.8) !important;
            cursor: pointer; animation: pulse 0.8s infinite alternate !important;
        }
        @keyframes pulse { 0% { filter: brightness(1); transform: scale(1); } 100% { filter: brightness(1.2); transform: scale(1.05); } }
        
        .buzz-btn.locked { background: #3a3a50 !important; cursor: not-allowed; opacity: 0.85; box-shadow: 0 8px 0 #1a1a2e !important; }
        
        .buzz-btn.success {
            background: radial-gradient(circle at 30% 30%, #2ed573, #10ac84) !important;
            box-shadow: 0 12px 0 #058564, 0 0 50px rgba(16,172,132,0.8) !important;
            animation: none !important;
        }

        #antiCheatOverlay {
            display: none; position: fixed; inset: 0; background: rgba(255,0,0,0.95); z-index: 99999; 
            flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 20px;
        }
        #antiCheatOverlay h1 { font-size: 40px; color: white; margin-bottom: 20px; }
        #antiCheatOverlay p { font-size: 20px; color: white; margin-bottom: 30px; }
        #antiCheatOverlay button { padding: 15px 30px; font-size: 20px; font-weight: bold; background: white; color: red; border: none; border-radius: 10px; cursor: pointer; }

        #videoOverlay { position: fixed; inset: 0; background: #000; z-index: 5000; display: none; flex-direction: column; align-items: center; justify-content: center; }
        #mainVideo { width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
        .volume-container {
            position: absolute; bottom: 20px; right: 20px; background: rgba(0,0,0,0.5);
            padding: 10px 20px; border-radius: 20px; display: flex; align-items: center; gap: 10px;
            backdrop-filter: blur(5px); transition: opacity 0.3s; opacity: 0.5; z-index: 5001;
        }
        .volume-container:hover { opacity: 1; }
        #volumeSlider { width: 150px; cursor: pointer; }
        
        #qBox {
            background: rgba(10, 25, 54, 0.8); backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 210, 211, 0.3); border-radius: 12px;
            width: 100%; max-width: 800px; padding: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            display: none; flex-direction: column; align-items: center; text-align: center; justify-content: center;
            height: clamp(150px, 40vh, 300px); overflow: hidden; z-index: 100;
            flex-shrink: 1; margin: 10px;
        }
        #qPoints {
            font-family: var(--font-general, 'SF Pro Display Bold', 'Segoe UI', sans-serif); font-size: 26px; font-weight: 700; color: #ff9f43; margin-bottom: 15px; flex-shrink: 0;
        }
        #qTextContainer {
            width: 100%; flex: 1; display: flex; align-items: flex-start; justify-content: flex-start; overflow: hidden;
        }
        #qText {
            font-size: clamp(20px, 4vw, 50px); font-weight: 700; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); word-break: break-word; line-height: 1.4; text-align: left; width: 100%;
        }

        .split-layout {
            display: flex; flex-direction: row; width: 100%; max-width: 1200px;
            align-items: center; justify-content: center; gap: 20px;
            flex: 1; padding: 10px; box-sizing: border-box;
        }

        @media (max-width: 768px) {
            .split-layout {
                flex-direction: column;
                justify-content: flex-start;
                gap: 10px;
            }
            #qBox {
                width: 95%; height: 20vh; min-height: 120px; max-width: 100%;
            }
            .buzzer-wrapper {
                width: 250px; height: 250px;
            }
        }
        #qText {
            font-size: clamp(24px, 4vw, 50px); font-weight: 700; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.8); word-break: break-word; line-height: 1.4; text-align: left; width: 100%;
        }
        
        body { user-select: none; -webkit-user-select: none; }
        input, textarea { user-select: text; -webkit-user-select: text; }
    </style>
    <script>
        try {
            const cachedFont = localStorage.getItem('econova_font_rules');
            if (cachedFont) {
                const s = document.createElement('style');
                s.id = 'dynamic-font-styles-global';
                s.textContent = cachedFont;
                document.head.appendChild(s);
            }
        } catch(e) {}
    </script>
</head>
<body>
    <!-- CHỐNG GIAN LẬN -->
    <div id="antiCheatOverlay">
        <h1 id="acTitle" data-i18n="con_cheat_title">🚨 CẢNH BÁO GIAN LẬN!</h1>
        <p id="acDesc" data-i18n="con_cheat_desc">Bạn đã rời khỏi màn hình thi hoặc bấm nhầm phím cấm. Thao tác này đã bị chặn lại.</p>
        <button id="acBtn" data-i18n="con_cheat_btn" onclick="document.getElementById('antiCheatOverlay').style.display='none';">TÔI ĐÃ HIỂU</button>
    </div>

    <!-- BẮT ĐẦU VÀ KÍCH HOẠT FULLSCREEN -->
    <div id="startOverlay" style="display: none; position: fixed; inset: 0; background: #030a1c; z-index: 999999; flex-direction: column; align-items: center; justify-content: center; text-align: center; cursor: pointer;" onclick="startApp()">
        <h1 style="font-size: 40px; color: #00d2d3;" data-i18n="con_click_start">BẤM VÀO ĐÂY ĐỂ BẮT ĐẦU</h1>
        <p style="color: #fff; margin-top: 10px;" data-i18n="con_req_full">Yêu cầu bật chế độ Toàn Màn Hình</p>
    </div>

        <!-- CHỌN ĐỘI -->
    <div id="selectScreen">
        <h1 data-i18n="con_choose">CHỌN ĐỘI CỦA BẠN</h1>
        <div id="teamBtns">
            <button class="team-btn" data-t="1" onclick="chooseTeam(1)"><span>Đội 1</span><span class="school"></span></button>
            <button class="team-btn" data-t="2" onclick="chooseTeam(2)"><span>Đội 2</span><span class="school"></span></button>
            <button class="team-btn" data-t="3" onclick="chooseTeam(3)"><span>Đội 3</span><span class="school"></span></button>
            <button class="team-btn" data-t="4" onclick="chooseTeam(4)"><span>Đội 4</span><span class="school"></span></button>
        </div>
    </div>

    <!-- MÀN HÌNH CHUÔNG -->
    <div id="buzzScreen">
        <div class="top-bar">
            <div class="team-info">
                <span class="team-name" id="myName" data-i18n="con_team_placeholder">TEAM</span>
                <span class="team-school" id="mySchool" data-i18n="con_school_placeholder">Trường</span>
            </div>
            <div class="score-display" id="myScore">0</div>
        </div>
        
        <div class="timer-container" id="timerContainer" style="display: none;">
            <div class="timer-bar" id="timerBar"></div>
        </div>

        <div class="main-area">
            <!-- Bảng lưới 36 câu -->
            <div class="grid-container" id="qGrid" style="display: flex;">
                <div class="grid-col">
                    <div class="grid-header" style="color: #10ac84" data-i18n="con_pts_10">10 ĐIỂM</div>
                    <div class="grid-cells" id="grid10"></div>
                </div>
                <div class="grid-col">
                    <div class="grid-header" style="color: #f39c12" data-i18n="con_pts_20">20 ĐIỂM</div>
                    <div class="grid-cells" id="grid20"></div>
                </div>
                <div class="grid-col">
                    <div class="grid-header" style="color: #e17055" data-i18n="con_pts_40">40 ĐIỂM</div>
                    <div class="grid-cells" id="grid40"></div>
                </div>
            </div>
            
            <div class="split-layout">
                <!-- Hộp câu hỏi -->
                <div id="qBox">
                    <div id="qPoints"></div>
                    <div id="qTextContainer">
                        <div id="qText"></div>
                    </div>
                </div>
                
                <!-- Chuông -->
                <div id="buzzerContainer" style="display: none;">
                    <div class="status-text" id="statusText">CHUÔNG KHÓA</div>
                    <div class="buzzer-wrapper">
                        <div class="ring" id="buzzRing"></div>
                        <button class="buzz-btn locked" id="buzzBtn">
                            <span id="btnIcon">🔔 BẤM CHUÔNG</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io({ 
            transports: ['websocket', 'polling'], 
            upgrade: true, 
            timeout: 8000, 
            reconnectionDelay: 500, 
            reconnectionDelayMax: 3000 
        });
        const roomPin = new URLSearchParams(window.location.search).get('pin') || sessionStorage.getItem('currentRoomPin') || '';
        
        // Mỗi tab/thiết bị có một Client ID riêng biệt
        let myClientId = sessionStorage.getItem('clientId_' + roomPin);
        if (!myClientId) {
            myClientId = 'c_' + Math.random().toString(36).substring(2) + '_' + Date.now();
            sessionStorage.setItem('clientId_' + roomPin, myClientId);
        }

        // Nạp tức thì trạng thái phòng qua HTTP GET (50ms - Không cần chờ WebSocket)
        if (roomPin) {
            fetch('/api/room/state?pin=' + encodeURIComponent(roomPin))
                .then(r => r.json())
                .then(data => {
                    if (data && data.success && data.gameState) {
                        handleUpdateState(data.gameState);
                        if (typeof armSkeletonTimeout === 'function') armSkeletonTimeout(); // reset timer after state received
                    } else if (data && !data.success) {
                        // Room not found on initial fetch - server might be restoring from cloud
                        // The skeleton timeout failsafe will handle retry and redirect if needed
                        console.log('[HTTP Prefetch] Room not found, will retry via failsafe:', data.message);
                    }
                })
                .catch(e => console.log('HTTP state fetch note:', e.message));
        }

        let savedTeam = sessionStorage.getItem('claimedTeamId_' + roomPin);
        let myTeamId = (savedTeam && !isNaN(parseInt(savedTeam))) ? parseInt(savedTeam) : null;
        let isSelected = (myTeamId !== null);
        let isRoomJoined = false; // Track WebSocket joinRoom completion
        let pendingClaimTeamId = null; // Queue claimTeam if fired before joinRoom completes
        let currentTeamCount = null;

        // FAILSAFE: If skeleton still showing after 10s, retry fetch up to 3 times
        let skeletonTimeoutId = null;
        let skeletonRetryCount = 0;
        const MAX_SKELETON_RETRIES = 3;
        function armSkeletonTimeout() {
            if (skeletonTimeoutId) clearTimeout(skeletonTimeoutId);
            skeletonTimeoutId = setTimeout(() => {
                const container = document.getElementById('teamBtns');
                if (container && container.querySelector('.skeleton-card')) {
                    if (window.currentState && window.currentState.teams) {
                        renderSelect(window.currentState.teams, window.currentState.claimedTeams || {});
                        skeletonTimeoutId = null;
                        return;
                    }
                    if (roomPin) {
                        fetch('/api/room/state?pin=' + encodeURIComponent(roomPin))
                            .then(r => r.json())
                            .then(data => {
                                if (data && data.success && data.gameState && data.gameState.teams) {
                                    handleUpdateState(data.gameState);
                                    skeletonTimeoutId = null;
                                } else {
                                    skeletonRetryCount++;
                                    if (skeletonRetryCount >= MAX_SKELETON_RETRIES) {
                                        alert((data && data.message) || 'Phòng không tồn tại hoặc đã đóng! Vui lòng liên hệ Admin.');
                                        window.location.href = './index.html';
                                    } else {
                                        // Retry after 5s
                                        armSkeletonTimeout();
                                    }
                                }
                            })
                            .catch(() => {
                                skeletonRetryCount++;
                                if (skeletonRetryCount >= MAX_SKELETON_RETRIES) {
                                    alert('Không thể kết nối tới server sau nhiều lần thử. Vui lòng tải lại trang.');
                                    window.location.reload();
                                } else {
                                    armSkeletonTimeout(); // retry
                                }
                            });
                    }
                }
            }, skeletonRetryCount === 0 ? 10000 : 5000);
        }
        armSkeletonTimeout();

        function onJoinRoomSuccess(gameState) {
            isRoomJoined = true;
            if (gameState) {
                // Nếu trước đó tab này từng chọn đội, kiểm tra xem đội đó có thuộc về client này không
                if (myTeamId !== null && gameState.claimedTeams && gameState.claimedTeams[myTeamId]) {
                    if (gameState.claimedTeams[myTeamId].clientId === myClientId) {
                        isSelected = true;
                        socket.emit('claimTeam', { teamId: myTeamId, clientId: myClientId, pin: roomPin });
                    } else {
                        // Đội đã bị người khác chọn ở thiết bị khác
                        myTeamId = null;
                        isSelected = false;
                        sessionStorage.removeItem('claimedTeamId_' + roomPin);
                    }
                } else if (myTeamId !== null) {
                    // Chưa ai chọn đội này -> reconnect nhận lại
                    isSelected = true;
                    socket.emit('claimTeam', { teamId: myTeamId, clientId: myClientId, pin: roomPin });
                }
                handleUpdateState(gameState);
            }
        }

        function tryJoinRoom(attempt) {
            if (!roomPin) return;
            socket.emit('joinRoom', roomPin, (res) => {
                if (!res || !res.success) {
                    console.log('[JoinRoom] Attempt', attempt, 'failed:', res && res.message);
                    if (attempt < 3) {
                        setTimeout(() => tryJoinRoom(attempt + 1), 3000);
                    } else {
                        alert((res && res.message) || 'Phòng không tồn tại hoặc đã đóng! Vui lòng liên hệ Admin.');
                        window.location.href = './index.html';
                    }
                } else {
                    onJoinRoomSuccess(res.gameState);
                }
            });
        }

        socket.on('connect', () => {
            isRoomJoined = false;
            tryJoinRoom(1);
        });

        if (socket.connected) {
            tryJoinRoom(1);
        }
        
        let timerInterval = null;
        const timerContainer = document.getElementById('timerContainer');
        const timerBar = document.getElementById('timerBar');

        const selectScreen = document.getElementById('selectScreen');
        const buzzScreen = document.getElementById('buzzScreen');
        const teamBtns = document.getElementById('teamBtns');
        
        const myName = document.getElementById('myName');
        const mySchool = document.getElementById('mySchool');

        function fitText(text) {
            qText.innerHTML = text;
            let size = 32;
            qText.style.fontSize = size + 'px';
            // Decrease font size until it fits container limits vertically
            while (qText.offsetHeight > qTextContainer.clientHeight - 4 && size > 14) {
                size -= 1;
                qText.style.fontSize = size + 'px';
            }
        }



        function resolveVideoUrl(url) {
            if (!url) return '';
            let u = url.trim();
            const gDriveMatch = u.match(/drive\.google\.com\/file\/d\/([a-zA-Z0-9_-]+)/);
            if (gDriveMatch && gDriveMatch[1]) {
                return `https://drive.google.com/uc?export=download&id=${gDriveMatch[1]}`;
            }
            if (/^[a-zA-Z]:[\\\/]/.test(u) || u.includes('\\')) {
                return '/api/video?path=' + encodeURIComponent(u);
            }
            if (u.startsWith('http://') || u.startsWith('https://')) {
                return u;
            }
            if (u.startsWith('/')) {
                return u;
            }
            if (u.startsWith('videos/')) {
                return '/' + u;
            }
            return '/api/video?path=' + encodeURIComponent(u);
        }

        let antiCheatEnabled = false;
        let isBanned = false;
        let lastReportTime = 0;

        function reportCheat(reason) {
            if (!antiCheatEnabled || isBanned) return;
            
            // Chống báo cáo đúp (debounce) trong vòng 2 giây
            if (Date.now() - lastReportTime < 2000) return;
            lastReportTime = Date.now();
            
            try {
                let ctx = new (window.AudioContext || window.webkitAudioContext)();
                let osc = ctx.createOscillator();
                let gain = ctx.createGain();
                osc.type = 'square';
                osc.frequency.setValueAtTime(800, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                setTimeout(() => osc.stop(), 500);
            } catch(e) {}

            if (!myTeamId) {
                const overlay = document.getElementById('antiCheatOverlay');
                document.getElementById('acTitle').innerText = '🚨 CẢNH BÁO GIAN LẬN (CHƯA CHỌN ĐỘI)';
                document.getElementById('acDesc').innerText = 'Hệ thống phát hiện hành vi: ' + reason;
                document.getElementById('acBtn').style.display = 'block';
                overlay.style.background = 'rgba(255,165,0,0.95)';
                overlay.style.display = 'flex';
                return;
            }
            socket.emit('antiCheatViolation', { teamId: myTeamId, reason });
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(e => {});
            }
            document.getElementById('startOverlay').style.display = 'none';
        }

        // Render / cập nhật nút chọn đội từ dữ liệu phòng thi
        function renderSelect(teams, claimed) {
            const lang = (window.currentState && window.currentState.settings && window.currentState.settings.language) || currentGlobalLang;
            const container = document.getElementById('teamBtns');
            if (!container) return;
            
            if (!teams || !Array.isArray(teams) || teams.length === 0) {
                teams = [
                    { id: 1, name: "Đội 1", school: "" },
                    { id: 2, name: "Đội 2", school: "" },
                    { id: 3, name: "Đội 3", school: "" },
                    { id: 4, name: "Đội 4", school: "" }
                ];
            }
            claimed = claimed || (window.currentState ? window.currentState.claimedTeams : {});
            
            const existingBtns = container.querySelectorAll('.team-btn');
            if (existingBtns.length !== teams.length) {
                container.innerHTML = '';
                teams.forEach(tObj => {
                    let btn = document.createElement('button');
                    btn.className = 'team-btn';
                    btn.dataset.t = tObj.id;
                    btn.onclick = () => chooseTeam(tObj.id);
                    btn.innerHTML = `<span>${tObj.name || ('Đội ' + tObj.id)}</span><span class="school">${tObj.school || ''}</span>`;
                    container.appendChild(btn);
                });
            }

            const currentBtns = container.querySelectorAll('.team-btn');
            teams.forEach((tObj, idx) => {
                const btn = currentBtns[idx];
                if (!btn) return;
                btn.dataset.t = tObj.id;
                
                let isClaimed = false;
                if (claimed && typeof claimed === 'object') {
                    for (let k in claimed) { 
                        if (Number(k) === Number(tObj.id) && claimed[k]) {
                            if (!myClientId || claimed[k].clientId !== myClientId) {
                                isClaimed = true;
                            }
                        }
                    }
                }
                
                if (btn.disabled !== isClaimed) btn.disabled = isClaimed;
                btn.style.opacity = isClaimed ? '0.45' : '1';
                btn.style.cursor = isClaimed ? 'not-allowed' : 'pointer';
                btn.style.filter = isClaimed ? 'grayscale(0.6)' : 'none';
                let claimedText = isClaimed ? ' ' + (typeof t === 'function' ? t('con_claimed', lang) : '(Đã có người chọn)') : '';
                let targetName = (tObj.name || ('Đội ' + tObj.id)) + claimedText;
                let targetSchool = tObj.school || '';
                btn.innerHTML = `<span>${targetName}</span><span class="school">${targetSchool}</span>`;
            });
        }

        // Xử lý đếm ngược thanh thời gian
        function startCountdownAnimation(seconds) {
            if (!isSelected) return;
            const timerContainer = document.getElementById('timerContainer');
            const timerBar = document.getElementById('timerBar');
            if (!timerContainer || !timerBar) return;

            timerContainer.style.display = 'block';
            let startTime = Date.now();
            let duration = (typeof seconds === 'number' && seconds > 0) ? seconds * 1000 : 5000;
            
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                let elapsed = Date.now() - startTime;
                let remaining = Math.max(0, (duration - elapsed) / 1000);
                let percent = (elapsed / duration) * 100;
                
                // Nếu chuông đang mở và là đội được bấm -> cập nhật số giây còn lại trực tiếp lên statusText!
                if (window.currentState && window.currentState.isBuzzerLocked === false && window.currentState.buzzedTeam === null) {
                    let isMainTeam = (window.currentState.currentQuestion && window.currentState.currentQuestion.mainTeamId != null && Number(window.currentState.currentQuestion.mainTeamId) === Number(myTeamId));
                    const statusText = document.getElementById('statusText');
                    if (!isMainTeam && statusText) {
                        statusText.textContent = `🚨 CHUÔNG ĐANG MỞ: ${remaining.toFixed(1)}S (BẤM NGAY)!`;
                        statusText.style.color = '#2ed573';
                        statusText.style.borderColor = '#2ed573';
                    }
                }

                if (percent >= 100) {
                    percent = 100;
                    clearInterval(timerInterval);
                    setTimeout(() => { 
                        timerContainer.style.display = 'none'; 
                        timerBar.style.width = '0%'; 
                    }, 500);
                }
                timerBar.style.width = percent + '%';
            }, 50);
        }

        function tryBuzz() {
            if (window.currentState && window.currentState.isBuzzerLocked) {
                return;
            }
            if (myTeamId !== null && !isBanned) {
                // Do not lock locally to allow subsequent buzzes
                
                try { if (navigator.vibrate) navigator.vibrate([60]); } catch(e) {}
                const token = window.currentState ? window.currentState.buzzToken : null;

                // 1. Gửi qua WebSocket ngay tức thì
                socket.emit('buzz', { teamId: myTeamId, token: token, clientId: myClientId, pin: roomPin });

                // 2. Gửi dự phòng HTTP POST để đảm bảo 100% không bao giờ rớt tín hiệu
                if (roomPin) {
                    fetch('/api/room/buzz', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ pin: roomPin, teamId: myTeamId, token: token, clientId: myClientId })
                    }).then(r => r.json()).then(res => {
                        if (res && res.success) {
                            renderBuzzerUI();
                        }
                    }).catch(() => {});
                }

                // 3. Phản hồi xúc giác tức thì trên UI
                if (buzzBtn && !buzzBtn.classList.contains('locked') && !buzzBtn.classList.contains('success')) {
                    // Do not change UI immediately per user request. Wait for server confirmation.
                }
            }
        }

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.key === ' ' || e.code === 'Enter') {

                        statusText.textContent = typeof t === 'function' ? t('con_wait_admin', (state.settings && state.settings.language) || currentGlobalLang) : '⏳ ĐANG CHỜ CÂU HỎI...';
                        statusText.style.color = 'rgba(255,255,255,0.7)';
                        statusText.style.borderColor = 'rgba(255,255,255,0.18)';
                    }
                }
            }
        }

        socket.on('openBuzzer', (data) => {
            if (!window.currentState) window.currentState = {};
            window.currentState.isBuzzerLocked = false;
            window.currentState.buzzedTeam = null;
            if (data && data.buzzToken) window.currentState.buzzToken = data.buzzToken;
            if (data && data.mainTeamId !== undefined) {
                if (!window.currentState.currentQuestion) window.currentState.currentQuestion = { active: false };
                window.currentState.currentQuestion.mainTeamId = data.mainTeamId;
            }
            renderBuzzerUI();
            const dur = (data && typeof data.duration === 'number' && data.duration > 0) ? data.duration : 5;
            startCountdownAnimation(dur);
        });

        socket.on('buzzed', (data) => {
            if (!window.currentState) window.currentState = {};
            window.currentState.buzzedTeam = data ? data.buzzedTeam : null;
            window.currentState.isBuzzerLocked = true;
            if (data && data.buzzTimes) window.currentState.buzzTimes = data.buzzTimes;
            renderBuzzerUI();
        });

        socket.on('lockBuzzer', () => {
            if (window.currentState) {
                window.currentState.isBuzzerLocked = true;
            }
            renderBuzzerUI();
        });

        // Self-healing State Heartbeat every 2s
        setInterval(() => {
            if (!roomPin || !isSelected) return;
            fetch('/api/room/state?pin=' + encodeURIComponent(roomPin))
                .then(r => r.json())
                .then(data => {
                    if (data && data.success && data.gameState) {
                        const st = data.gameState;
                        if (!window.currentState || 
                            window.currentState.isBuzzerLocked !== st.isBuzzerLocked || 
                            window.currentState.buzzedTeam !== st.buzzedTeam ||
                            (st.currentQuestion && (!window.currentState.currentQuestion || window.currentState.currentQuestion.text !== st.currentQuestion.text))) {
                            handleUpdateState(st);
                        }
                    }
                })
                .catch(() => {});
        }, 2000);

        socket.on('updateState', handleUpdateState);
        
        socket.on('teamReleased', (data) => {
            alert('Quản trị viên đã giải phóng thiết bị của đội bạn. Vui lòng chọn lại đội.');
            isSelected = false;
            myTeamId = null;
            sessionStorage.removeItem('claimedTeamId_' + roomPin);
            selectScreen.style.display = 'flex';
            buzzScreen.style.display = 'none';
            if (window.currentState) renderSelect(window.currentState.teams || [], window.currentState.claimedTeams || {});
        });

        function handleUpdateState(state) {
            if (!state) return;
            window.currentState = state;

            // ================= FONT LOGIC (CACHED) =================
            if (state.settings) {
                let s = state.settings;
                let globalEnabled = s.globalFontEnabled || false;
                let fGlobal = s.fontGlobal || 'SF Pro Display Bold';
                let fGeneral = s.fontGeneral || 'SF Pro Display Bold';
                let fQuestion = s.fontQuestion || 'SF Pro Display Bold';
                let fTeam = s.fontTeamName || 'SF Pro Display Bold';
                let fScore = s.fontScore || 'Orbitron';
                
                let fontCacheKey = `${globalEnabled}_${fGlobal}_${fGeneral}_${fQuestion}_${fTeam}_${fScore}`;
                if (window.lastFontCacheKey !== fontCacheKey) {
                    window.lastFontCacheKey = fontCacheKey;
                    let styleEl = document.getElementById('dynamic-font-styles-global');
                    if (!styleEl) {
                        styleEl = document.createElement('style');
                        styleEl.id = 'dynamic-font-styles-global';
                        document.head.appendChild(styleEl);
                    }
                    
                    let rules = '';
                    if (globalEnabled) {
                        rules += `@font-face { font-family: 'CustomFontGlobal'; src: url('/font/${encodeURIComponent(fGlobal)}'); }\n`;
                        rules += `:root { 
                            --font-general: 'CustomFontGlobal', '${fGlobal}', '${fGlobal.replace(/\s+/g, '')}', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                            --font-team-name: 'CustomFontGlobal', '${fGlobal}', '${fGlobal.replace(/\s+/g, '')}', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                            --font-score: 'CustomFontGlobal', '${fGlobal}', 'Orbitron', sans-serif;
                            --font-question: 'CustomFontGlobal', '${fGlobal}', '${fGlobal.replace(/\s+/g, '')}', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                        }`;
                    } else {
                        rules += `@font-face { font-family: 'CustomFontGeneral'; src: url('/font/${encodeURIComponent(fGeneral)}'); }\n`;
                        rules += `@font-face { font-family: 'CustomFontQuestion'; src: url('/font/${encodeURIComponent(fQuestion)}'); }\n`;
                        rules += `@font-face { font-family: 'CustomFontTeamName'; src: url('/font/${encodeURIComponent(fTeam)}'); }\n`;
                        rules += `@font-face { font-family: 'CustomFontScore'; src: url('/font/${encodeURIComponent(fScore)}'); }\n`;
                        
                        rules += `:root { 
                            --font-general: 'CustomFontGeneral', '${fGeneral}', '${fGeneral.replace(/\s+/g, '')}', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                            --font-team-name: 'CustomFontTeamName', '${fTeam}', '${fTeam.replace(/\s+/g, '')}', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                            --font-score: 'CustomFontScore', '${fScore}', '${fScore.replace(/\s+/g, '')}', 'Orbitron', sans-serif;
                            --font-question: 'CustomFontQuestion', '${fQuestion}', '${fQuestion.replace(/\s+/g, '')}', 'SF Pro Display Bold', 'Segoe UI', sans-serif;
                        }`;
                    }
                    if (styleEl.innerHTML !== rules) {
                        styleEl.innerHTML = rules;
                        let loadGF = (fName) => {
                            if (!fName) return;
                            let sName = fName.replace(/['"]/g, '').trim();
                            let lId = 'gf-' + sName.replace(/\s+/g, '-').toLowerCase();
                            if (!document.getElementById(lId)) {
                                let l = document.createElement('link'); l.id = lId; l.rel = 'stylesheet';
                                l.href = 'https://fonts.googleapis.com/css2?family=' + sName.replace(/\s+/g, '+') + ':ital,wght@0,400;0,700;0,900;1,400;1,700;1,900&display=swap';
                                document.head.appendChild(l);
                            }
                        };
                        if (typeof globalEnabled !== 'undefined' && globalEnabled) { loadGF(typeof fGlobal !== 'undefined' ? fGlobal : null); }
                        else {
                            if (typeof fGeneral !== 'undefined') loadGF(fGeneral);
                            if (typeof fQuestion !== 'undefined') loadGF(fQuestion);
                            if (typeof fTeam !== 'undefined') loadGF(fTeam);
                            if (typeof fScore !== 'undefined') loadGF(fScore);
                        }
                    }
                    try { localStorage.setItem('econova_font_rules', rules); } catch(e) {}
                }
            }

            if (!state.teams || !Array.isArray(state.teams) || state.teams.length === 0) {
                // Phòng chưa có danh sách đội - hiển thị skeleton tiếp tục
                return;
            }
            
            if (currentTeamCount !== null && currentTeamCount !== state.teams.length) {
                myTeamId = null;
                isSelected = false;
                selectScreen.style.display = 'flex';
                buzzScreen.style.display = 'none';
                const lang = (window.currentState && window.currentState.settings && window.currentState.settings.language) || currentGlobalLang;
                alert(t('con_team_count_changed', lang));
            }
            currentTeamCount = state.teams.length;
            
            if (state.settings) {
                let newAntiCheat = !!state.settings.antiCheat;
                if (newAntiCheat !== antiCheatEnabled) {
                    antiCheatEnabled = newAntiCheat;
                    if (window.electronAPI && window.electronAPI.setAntiCheat) {
                        window.electronAPI.setAntiCheat(antiCheatEnabled);
                    }
                    if (antiCheatEnabled && !document.fullscreenElement) {
                        document.getElementById('startOverlay').style.display = 'flex';
                    } else if (!antiCheatEnabled) {
                        document.getElementById('startOverlay').style.display = 'none';
                        document.getElementById('antiCheatOverlay').style.display = 'none';
                        isBanned = false;
                    }
                }
                if (state.settings.language) {
                    applyTranslations(state.settings.language);
                }
            }

            let me = (state.teams && myTeamId !== null) ? state.teams.find(t => Number(t.id) === Number(myTeamId)) : null;
            if (!me) {
                // Chưa chọn đội hoặc đội không tồn tại trong phòng này -> Hiển thị màn hình chọn đội
                isSelected = false;
                myTeamId = null;
                sessionStorage.removeItem('claimedTeamId_' + roomPin);
                selectScreen.style.display = 'flex';
                buzzScreen.style.display = 'none';
                renderSelect(state.teams || [], state.claimedTeams || {});
                if (typeof skeletonTimeoutId !== 'undefined' && skeletonTimeoutId) { clearTimeout(skeletonTimeoutId); skeletonTimeoutId = null; }
                return;
            } else {
                isSelected = true;
                selectScreen.style.display = 'none';
                buzzScreen.style.display = 'flex';

                // Check if banned
                if (state.bannedTeams && state.bannedTeams.includes(myTeamId)) {
                    isBanned = true;
                    const overlay = document.getElementById('antiCheatOverlay');
                    if (overlay) {
                        document.getElementById('acTitle').innerText = '⛔ BẠN ĐÃ BỊ CẤM THI';
                        document.getElementById('acDesc').innerText = 'Vi phạm quá nhiều lần. Vui lòng liên hệ Admin.';
                        document.getElementById('acBtn').style.display = 'none';
                        overlay.style.background = 'rgba(255,0,0,1)';
                        overlay.style.display = 'flex';
                    }
                } else if (isBanned) {
                    isBanned = false;
                    const overlay = document.getElementById('antiCheatOverlay');
                    if (overlay) overlay.style.display = 'none';
                }

                let isMain = false;
                if (state.currentQuestion && state.currentQuestion.active) {
                    isMain = (state.currentQuestion.mainTeamId === me.id);
                } else {
                    isMain = (state.turnOrder && state.turnOrder.length > 0 && state.turnOrder[0] === me.id);
                }

                myName.textContent = me.name;
                mySchool.textContent = me.school || '';
                myScore.textContent = me.score;
                
                const qGrid = document.getElementById('qGrid');
                if (qGrid) qGrid.style.display = 'none';
                
                const buzzerContainer = document.getElementById('buzzerContainer');
                let q = state.currentQuestion || { active: false };

                function applyVisibility() {
                    if (!q.active) {
                        qBox.style.display = 'none';
                        buzzerContainer.style.display = 'flex';
                        statusText.style.display = 'block';
                    } else {
                        let textPts = typeof t === 'function' ? t("scr_pts", window.currentGlobalLang) : "ĐIỂM";
                        qPoints.textContent = `${q.points} ${textPts}`;
                        
                        let newText = q.isHidden ? "" : (q.mode === 3 ? (q.text || "") : (q.text || (typeof t === 'function' ? t('scr_wait', window.currentGlobalLang) : "Đang chờ câu hỏi...")));
                        
                        qBox.style.display = 'flex';
                        buzzerContainer.style.display = 'flex';
                        statusText.style.display = 'block';
                        fitText(newText);
                    }
                }

                if (q.active && !window.lastActiveState && q.idx !== null) {
                    window.isAnimating = true;
                    qBox.style.display = 'none';
                    buzzerContainer.style.display = 'none';
                    statusText.style.display = 'none';

                    setTimeout(() => {
                        window.isAnimating = false;
                        applyVisibility();
                        renderBuzzerUI();
                    }, 500);
                } else if (!window.isAnimating) {
                    applyVisibility();
                }

                window.lastActiveState = q.active;
                window.currentState = state;

                renderBuzzerUI();
            }
        }
    </script>
</body>
</html>
